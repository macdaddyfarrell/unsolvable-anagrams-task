<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Anagram task – local preview</title>
<style>body{max-width:800px;margin:40px auto;} pre{background:#f4f4f4;padding:12px;white-space:pre-wrap;font-size:12px;}</style>
</head>
<body>
<p style="color:#888;font-size:13px">Local preview: a stand-in for Qualtrics. Keep this file in the same folder as qualtrics_anagram_task.js.</p>
<div id="jspsych-target"></div>
<pre id="out" style="display:none"></pre>
<script>
  // Minimal stand-in for the Qualtrics API
  var _ed = {}, _ready;
  window.Qualtrics = { SurveyEngine: {
    addOnload: function(){}, addOnUnload: function(){},
    addOnReady: function(f){ _ready = f; },
    setEmbeddedData: function(k, v){ _ed[k] = v; }
  }};
</script>
<script src="qualtrics_anagram_task.js"></script>
<script>
  _ready.call({
    hideNextButton: function(){}, hidePreviousButton: function(){}, showNextButton: function(){},
    clickNextButton: function(){
      var o = document.getElementById('out');
      o.style.display = 'block';
      o.textContent = 'Task finished. Embedded data that would be saved to Qualtrics:\n\n' + JSON.stringify(_ed, null, 2);
    }
  });
</script>
</body>
</html>
